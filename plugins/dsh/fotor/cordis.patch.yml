# Installation declares inert host-owned components. Configure before enabling.
- insert:
    - id: fotor-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: true
      config:
        providerName: fotor
        includeDefaultRoots: false
        customSkillDirs: []
    - id: fotor-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: fotor
        transport: stdio
        failOnStartupError: false
        reconnect:
          enabled: false
